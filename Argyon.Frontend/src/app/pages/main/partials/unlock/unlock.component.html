<section class="w-full h-dvh overflow-y-auto flex justify-center items-center">
    <p-card>
        <form class="flex flex-col" (submit)="this.OnSubmit($event)">
            <h1 class="text-center">{{ 'unlock.title' | translate }}</h1>
            <p-divider />
            <div class="form-content">
                <div class="form-field">
                    <component-input-text [(value)]="this.thisService.username" [readonly]="true" [disabled]="true" [label]="'common.username' | translate" />
                </div>

                <div class="form-field">
                    <component-input-password [formField]="this.unlockSignal.password" [placeholder]="'common.passwordPlaceholder' | translate" [label]="'common.password' | translate" />
                    @if (this.unlockSignal.password().touched()) {
                        @for (error of this.unlockSignal.password().errors(); track $index) {
                            <p-message severity="error" size="small" variant="simple">{{ error.message }}</p-message>
                        }
                    }
                </div>
            </div>
            <p-divider />
            <div>
                <component-button type="submit" [disabled]="this.unlockSignal().invalid()" [label]="'unlock.unlock' | translate"
                    severity="success" />
            </div>
        </form>
    </p-card>
</section>
